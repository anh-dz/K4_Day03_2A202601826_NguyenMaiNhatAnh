<!DOCTYPE html>
<html class="light" lang="vi">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>CareerWay - AI Career Mentor</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries,typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

                        "surface-container-high": "#e5e8ee",
                        "secondary": "#005ac1",
                        "inverse-surface": "#2d3135",
                        "primary": "#1a73e8",
                        "secondary-container": "#4d8efe",
                        "on-primary-container": "#ffffff",
                        "background": "#f7f9ff",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#c1c6d6",
                        "on-primary-fixed": "#001a41",
                        "error-container": "#ffdad6",
                        "on-tertiary-container": "#ffffff",
                        "on-tertiary-fixed": "#002108",

                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#6ddd81",
                        "on-tertiary-fixed-variant": "#005320",
                        "on-secondary-container": "#00285c",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#414754",
                        "tertiary-container": "#008939",
                        "primary-fixed": "#d8e2ff",
                        "outline": "#727785",
                        "inverse-on-surface": "#eef1f7",
                        "surface-container": "#ebeef4",
                        "inverse-primary": "#adc7ff",
                        "surface-bright": "#f7f9ff",
                        "on-surface": "#181c20",
                        "surface-variant": "#dfe3e8",
                        "surface-dim": "#d7dae0",
                        "on-secondary-fixed-variant": "#004494",
                        "on-background": "#181c20",
                        "primary-container": "#1a73e8"
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",

                    spacing: {

                        "sm": "16px",
                        "md": "24px",
                        "gutter": "24px",
                        "lg": "32px",
                        "xl": "48px",
                        "container-max": "1280px"
                    },
                    fontFamily: {
                        "sans": ["Inter", "sans-serif"],
                        "label-lg": ["Inter", "sans-serif"],
                        "body-lg": ["Inter", "sans-serif"],
                        "headline-lg": ["Inter", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"],
                        "title-md": ["Inter", "sans-serif"],
                        "label-md": ["Inter", "sans-serif"],
                        "display-lg": ["Inter", "sans-serif"],
                        "headline-md": ["Inter", "sans-serif"],
                        "title-lg": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9ff;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .chat-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background: #dfe3e8;
            border-radius: 10px;
        }
        .chat-scroll::-webkit-scrollbar-thumb:hover {
            background: #c1c6d6;
        }
        /* Hide scrollbar for chips */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .message-in {
            animation: slideUp 0.3s ease-out forwards;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .typing-indicator span {
            animation: blink 1.4s infinite both;
            height: 6px;
            width: 6px;
            background: #727785;
            border-radius: 50%;
            display: inline-block;
            margin: 0 1px;
        }
        .typing-indicator span:nth-child(1) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.4s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.6s; }
        @keyframes blink {
            0% { opacity: 0.2; }
            20% { opacity: 1; }
            100% { opacity: 0.2; }
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-on-surface bg-background">
    <!-- Main Chat Area -->
    <main class="flex-1 flex flex-col relative bg-background w-full">
        <!-- Chat Header -->
        <header class="h-16 flex items-center justify-between px-lg bg-surface border-b border-outline-variant z-10">
            <div class="flex items-center gap-sm">
                <div class="w-10 h-10 bg-secondary-container rounded-full flex items-center justify-center text-on-secondary-container">
                    <span class="material-symbols-outlined fill" data-icon="smart_toy">smart_toy</span>
                </div>
                <div>
                    <h2 class="font-semibold text-[16px] text-on-surface flex items-center gap-xs">
                        CareerWay - Trợ lý CareerWay
                        <span class="w-2 h-2 bg-tertiary rounded-full animate-pulse"></span>
                    </h2>
                    <p class="text-[12px] font-medium text-on-surface-variant">Online</p>
                </div>
            </div>
        </header>

        <!-- Messages Canvas -->
        <section class="flex-1 overflow-y-auto chat-scroll p-md md:p-lg flex flex-col w-full" id="chat-wrapper">
            <div class="w-full max-w-4xl mx-auto flex flex-col gap-lg pb-xl" id="chat-container">
                
                <!-- Date Separator -->
                <div class="flex justify-center w-full mt-sm">
                    <span class="px-md py-1 bg-surface-container-high rounded-full text-[12px] text-on-surface-variant font-medium">Hôm nay</span>
                </div>
                
                <!-- AI Message 1 -->
                <div class="flex gap-sm max-w-[90%] md:max-w-[85%] message-in self-start">
                    <div class="w-9 h-9 rounded-full bg-secondary-container flex items-center justify-center shrink-0 mt-1 text-on-secondary-container shadow-sm border border-secondary-fixed-dim/30">
                        <span class="material-symbols-outlined fill text-[20px]" data-icon="smart_toy">smart_toy</span>
                    </div>
                    <div class="flex flex-col gap-1 items-start">
                        <div class="bg-surface-container-lowest border border-outline-variant p-4 rounded-[20px] rounded-tl-[4px] shadow-sm">
                            <p class="text-[15px] md:text-[16px] text-on-surface leading-relaxed">Chào mừng bạn đến với CareerWay! Tôi là cố vấn sự nghiệp ảo của bạn. 🌟</p>
                        </div>
                        <span class="text-[12px] text-on-surface-variant ml-1 font-medium">10:00 AM</span>
                    </div>
                </div>
                <!-- Các câu hỏi khảo sát RIASEC và chat tự do sau đó được thêm động bằng JS (xem startSurvey()) -->

            </div>
        </section>

        <!-- Input Area -->
        <footer class="px-md md:px-lg pb-md md:pb-lg pt-2 flex flex-col items-center w-full bg-gradient-to-t from-background via-background to-transparent">
            <div class="w-full max-w-4xl flex flex-col items-center">
                
                <!-- Quick Reply Chips: mặc định trống, JS nạp chip khảo sát RIASEC (1-5) khi tải trang,
                     sau đó đổi sang chip chủ đề gợi ý khi khảo sát xong (xem startSurvey()/finishSurvey()) -->
                <div id="quick-replies" class="flex gap-sm mb-md overflow-x-auto no-scrollbar w-full pb-2 snap-x transition-all"></div>
                
                <!-- Message Box -->
                <div class="relative bg-surface-container-lowest border border-outline-variant rounded-[24px] p-1.5 flex items-end gap-1 shadow-sm focus-within:ring-2 focus-within:ring-primary/50 focus-within:border-primary transition-all w-full">
                    <button class="p-2.5 mb-1 text-on-surface-variant hover:bg-surface-container hover:text-on-surface rounded-full transition-colors shrink-0">
                        <span class="material-symbols-outlined text-[22px]" data-icon="add">add</span>
                    </button>
                    
                    <textarea 
                        id="chat-input"
                        rows="1"
                        class="flex-1 bg-transparent border-none focus:ring-0 text-[15px] md:text-[16px] py-3.5 px-2 placeholder:text-outline resize-none max-h-32 chat-scroll" 
                        placeholder="Nhập câu hỏi của bạn..." 
                        style="min-height: 52px;"
                    ></textarea>
                    
                    <button class="p-2.5 mb-1 text-on-surface-variant hover:bg-surface-container hover:text-on-surface rounded-full transition-colors shrink-0">
                        <span class="material-symbols-outlined text-[22px]" data-icon="mood">mood</span>
                    </button>
                    <button id="send-btn" class="w-11 h-11 mb-1 bg-surface-container-high text-on-surface-variant rounded-[16px] flex items-center justify-center transition-all shrink-0 mr-0.5">
                        <span class="material-symbols-outlined text-[20px] fill" data-icon="send">send</span>
                    </button>
                </div>
                
                <p class="text-center text-[11px] md:text-[12px] text-outline mt-3">CareerWay AI có thể cung cấp thông tin không chính xác. Hãy kiểm tra các nguồn tin cậy.</p>
            </div>
        </footer>
    </main>

    <script>
        // GFM "breaks: true" -> xuống dòng đơn (\n) trong câu trả lời cũng hiển thị xuống dòng
        // thật, thay vì mặc định CommonMark chỉ coi 1 dòng mới là khoảng trắng.
        marked.setOptions({ breaks: true });

        const input = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const container = document.getElementById('chat-container');
        const wrapper = document.getElementById('chat-wrapper');
        
        // Auto-resize textarea
        input.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            
            if (this.value.trim().length > 0) {
                sendBtn.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
                sendBtn.classList.add('bg-primary', 'text-on-primary', 'shadow-md', 'hover:brightness-110', 'active:scale-95');
            } else {
                sendBtn.classList.add('bg-surface-container-high', 'text-on-surface-variant');
                sendBtn.classList.remove('bg-primary', 'text-on-primary', 'shadow-md', 'hover:brightness-110', 'active:scale-95');
            }
        });

        // ============================================================
        // 📋 KHẢO SÁT RIASEC MẶC ĐỊNH (chạy trước khi vào chat tự do)
        // Lý do: để LLM tự đoán điểm tính cách qua hội thoại tự do sẽ không xác định
        // (deterministic) được — dùng đúng bộ câu hỏi chuẩn từ backend (RIASEC_SURVEY_QUESTIONS)
        // và gộp điểm y hệt logic collect_riasec_answers() ở bản CLI.
        // ============================================================
        let surveyQuestions = [];
        let surveyIndex = 0;
        let surveyRawScores = [];   // [{trait, score}, ...]
        let surveyActive = false;
        let riasecAnswers = null;   // {"R": 2, "I": 5, ...} sau khi khảo sát xong

        function addBotBubble(text) {
            const html = `
                <div class="flex gap-sm max-w-[90%] md:max-w-[85%] message-in self-start">
                    <div class="w-9 h-9 rounded-full bg-secondary-container flex items-center justify-center shrink-0 mt-1 text-on-secondary-container shadow-sm border border-secondary-fixed-dim/30">
                        <span class="material-symbols-outlined fill text-[20px]" data-icon="smart_toy">smart_toy</span>
                    </div>
                    <div class="flex flex-col gap-1 items-start">
                        <div class="bg-surface-container-lowest border border-outline-variant p-4 rounded-[20px] rounded-tl-[4px] shadow-sm">
                            <p class="text-[15px] md:text-[16px] text-on-surface leading-relaxed">${text}</p>
                        </div>
                        <span class="text-[12px] text-on-surface-variant ml-1 font-medium">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
            wrapper.scrollTop = wrapper.scrollHeight;
        }

        function addUserBubble(text) {
            const html = `
                <div class="flex gap-sm max-w-[90%] md:max-w-[85%] self-end flex-row-reverse message-in">
                    <div class="w-9 h-9 rounded-full bg-primary flex items-center justify-center shrink-0 mt-1 text-on-primary font-bold text-[14px] shadow-sm">S</div>
                    <div class="flex flex-col gap-1 items-end">
                        <div class="bg-primary text-on-primary p-4 rounded-[20px] rounded-tr-[4px] shadow-sm">
                            <p class="text-[15px] md:text-[16px] leading-relaxed whitespace-pre-wrap">${text}</p>
                        </div>
                        <span class="text-[12px] text-on-surface-variant mr-1 font-medium">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', html);
            wrapper.scrollTop = wrapper.scrollHeight;
        }

        function setInputEnabled(enabled) {
            input.disabled = !enabled;
            input.placeholder = enabled ? "Nhập câu hỏi của bạn..." : "Vui lòng chọn điểm 1-5 phía trên để trả lời khảo sát...";
        }

        function renderQuickReplyChips(items, onClick) {
            const el = document.getElementById('quick-replies');
            el.innerHTML = '';
            items.forEach(label => {
                const btn = document.createElement('button');
                btn.className = 'snap-start px-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-full text-[14px] text-on-surface-variant hover:bg-primary-container hover:text-on-primary-container hover:border-transparent transition-all whitespace-nowrap active:scale-95 shadow-sm';
                btn.innerText = label;
                btn.onclick = () => onClick(label);
                el.appendChild(btn);
            });
        }

        function aggregateRiasecAnswers(rawScores) {
            const byTrait = {};
            rawScores.forEach(({ trait, score }) => {
                (byTrait[trait] = byTrait[trait] || []).push(score);
            });
            const result = {};
            for (const trait in byTrait) {
                const arr = byTrait[trait];
                result[trait] = Math.round(arr.reduce((a, b) => a + b, 0) / arr.length);
            }
            return result;
        }

        async function startSurvey() {
            surveyActive = true;
            setInputEnabled(false);
            try {
                const res = await fetch('/api/survey-questions');
                const data = await res.json();
                surveyQuestions = data.questions || [];
            } catch (e) {
                console.error('Không tải được câu hỏi khảo sát:', e);
            }

            if (!surveyQuestions.length) {
                // Backend chưa sẵn sàng / lỗi -> bỏ qua khảo sát, cho chat tự do luôn
                surveyActive = false;
                setInputEnabled(true);
                return;
            }

            addBotBubble("Trước khi tư vấn, hãy trả lời nhanh 12 câu khảo sát RIASEC để mình hiểu tính cách của bạn nhé! Chọn điểm từ 1 (rất không đồng ý) đến 5 (rất đồng ý).");
            askNextSurveyQuestion();
        }

        function askNextSurveyQuestion() {
            if (surveyIndex >= surveyQuestions.length) {
                finishSurvey();
                return;
            }
            const q = surveyQuestions[surveyIndex];
            addBotBubble(`Câu ${surveyIndex + 1}/${surveyQuestions.length}: ${q.question}`);
            renderQuickReplyChips(['1', '2', '3', '4', '5'], (label) => answerSurveyQuestion(parseInt(label, 10)));
        }

        function answerSurveyQuestion(score) {
            const q = surveyQuestions[surveyIndex];
            surveyRawScores.push({ trait: q.trait, score });
            addUserBubble(String(score));
            surveyIndex++;
            askNextSurveyQuestion();
        }

        function finishSurvey() {
            riasecAnswers = aggregateRiasecAnswers(surveyRawScores);
            surveyActive = false;
            addBotBubble("Cảm ơn bạn! Mình đã ghi nhận kết quả khảo sát. Giờ bạn có thể hỏi mình bất cứ điều gì về định hướng nghề nghiệp nhé.");
            // Chỉ giữ gợi ý đúng phạm vi ĐỊNH HƯỚNG nghề nghiệp (khớp 3 tool hiện có:
            // run_personality_assessment, match_profile_to_careers, get_career_detail) —
            // không gợi ý các chủ đề ngoài phạm vi như tư vấn CV, lộ trình học...
            renderQuickReplyChips(
                ["Nghề nào phù hợp với tính cách của tôi?", "Xem chi tiết nghề được gợi ý"],
                (label) => sendQuickReply(label)
            );
            setInputEnabled(true);
        }

        // Send message function
        function sendMessage(overrideText) {
            if (surveyActive) return; // khi đang khảo sát, chỉ nhận trả lời qua chip 1-5
            const message = (typeof overrideText === 'string') ? overrideText.trim() : input.value.trim();
            if (message === '') return;

            addUserBubble(message);

            // Reset input
            input.value = '';
            input.style.height = 'auto';
            sendBtn.classList.add('bg-surface-container-high', 'text-on-surface-variant');
            sendBtn.classList.remove('bg-primary', 'text-on-primary', 'shadow-md', 'hover:brightness-110', 'active:scale-95');

            // Fetch AI response
            fetchAIResponse(message);
        }

        async function fetchAIResponse(userMessage) {
            // Add typing indicator with streaming support
            const messageId = 'msg-' + Date.now();
            const typingMsg = `
                <div id="${messageId}" class="flex gap-sm max-w-[90%] md:max-w-[85%] message-in self-start w-full">
                    <div class="w-9 h-9 rounded-full bg-secondary-container flex items-center justify-center shrink-0 mt-1 text-on-secondary-container shadow-sm border border-secondary-fixed-dim/30">
                        <span class="material-symbols-outlined fill text-[20px]" data-icon="smart_toy">smart_toy</span>
                    </div>
                    <div class="flex flex-col gap-1 items-start w-full min-w-0">
                        <div id="content-${messageId}" class="bg-surface-container-lowest border border-outline-variant p-4 rounded-[20px] rounded-tl-[4px] shadow-sm flex items-center h-[56px] prose prose-sm md:prose-base prose-blue max-w-none text-on-surface">
                            <div class="typing-indicator flex items-center justify-center">
                                <span></span><span></span><span></span>
                            </div>
                        </div>
                        <span id="time-${messageId}" class="text-[12px] text-on-surface-variant ml-1 font-medium hidden">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', typingMsg);
            wrapper.scrollTop = wrapper.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: userMessage, answers: riasecAnswers })
                });
                
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let done = false;
                let fullAnswer = "";
                let isFirstChunk = true;
                let buffer = ''; // giữ phần dòng SSE chưa đọc hết giữa 2 lần reader.read()

                const contentDiv = document.getElementById(`content-${messageId}`);
                const timeSpan = document.getElementById(`time-${messageId}`);

                while (!done) {
                    const { value, done: readerDone } = await reader.read();
                    if (readerDone) {
                        done = true;
                        break;
                    }

                    // Nối phần dữ liệu mới vào buffer rồi tách theo dòng THẬT ('\n', không phải
                    // chuỗi 2 ký tự '\\n'). Dòng cuối có thể chưa đầy đủ (bị cắt giữa 2 lần read)
                    // nên giữ lại trong buffer cho vòng lặp kế tiếp thay vì parse dở dang.
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.substring(6));
                                if (data.done) {
                                    done = true;
                                    break;
                                }
                                if (data.chunk) {
                                    if (isFirstChunk) {
                                        contentDiv.classList.remove('flex', 'items-center', 'h-[56px]');
                                        isFirstChunk = false;
                                    }
                                    fullAnswer += data.chunk;
                                    const rawHtml = marked.parse(fullAnswer);
                                    contentDiv.innerHTML = DOMPurify.sanitize(rawHtml);
                                    wrapper.scrollTop = wrapper.scrollHeight;
                                }
                            } catch (e) {
                                console.error('Error parsing SSE data:', e, line);
                            }
                        }
                    }
                }

                timeSpan.classList.remove('hidden');
                
            } catch (error) {
                const contentDiv = document.getElementById(`content-${messageId}`);
                contentDiv.classList.remove('flex', 'items-center', 'h-[56px]', 'prose');
                contentDiv.classList.add('bg-error-container', 'text-on-error-container');
                contentDiv.innerHTML = '<p class="text-[15px] md:text-[16px] leading-relaxed whitespace-pre-wrap">Lỗi kết nối đến máy chủ. Vui lòng kiểm tra xem server đã chạy chưa.</p>';
                document.getElementById(`time-${messageId}`).classList.remove('hidden');
                console.error("Lỗi:", error);
            }
        }

        function sendQuickReply(text) {
            sendMessage(text);
        }

        // Expose function for AI to update chips dynamically
        window.setQuickReplies = function(repliesArray) {
            const quickRepliesContainer = document.getElementById('quick-replies');
            if (!quickRepliesContainer) return;
            
            quickRepliesContainer.innerHTML = '';
            repliesArray.forEach(reply => {
                const btn = document.createElement('button');
                btn.className = 'snap-start px-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-full text-[14px] text-on-surface-variant hover:bg-primary-container hover:text-on-primary-container hover:border-transparent transition-all whitespace-nowrap active:scale-95 shadow-sm';
                btn.innerText = reply;
                btn.onclick = function() { sendQuickReply(reply); };
                quickRepliesContainer.appendChild(btn);
            });
        };

        sendBtn.addEventListener('click', sendMessage);

        // Allow Enter to send (Shift+Enter for new line)
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Mặc định: bắt đầu khảo sát RIASEC ngay khi vào trang, trước khi cho chat tự do.
        startSurvey();
    </script>
</body>
</html>
